# SMIT model registry.
#
# Each entry sets the defaults run_segmentation.py uses for --model <NAME>; any option given
# on the command line overrides them. Weights are NOT in this repository: they are shared
# separately and installed with  python get_weights.py --model <NAME> --url <link>
# as weights/<NAME>.pt, then checked against weights.sha256.
#
# status:  validated  - settings, weights and checksum confirmed; model card in docs/models/
#          incomplete - network settings only; pass the preprocessing options yourself
#
# network.arch:  smit       - SMIT_3D_Seg (smit_models/smit.py); uses depths, use_encoder5
#                smit_plus  - SMIT_Plus (smit_models/smit_plus.py); uses feature_size
# preprocessing.hu_window: intensities are clipped to this range and scaled to [0, 1]
# preprocessing.spacing_mm: resampling spacing (x, y, z) before inference; output is
#                           resampled back to the input grid
# inference.body_mask: zero labels outside the body (CT, -150 HU threshold)
# weights.sha256 / version: checksum and version of the released weights file
# weights.source (optional): where get_weights.py downloads the weights when no --url / --file is given.
#   Without it, weights are shared on request (a link sent by the maintainers). Examples:
#     source: {type: huggingface, repo: cerr/CT_ThoraxOARs_SMITplus, file: CT_ThoraxOARs_SMITplus.pt, revision: v1.0}
#     source: {type: url, url: "https://example.org/CT_ThoraxOARs_SMITplus.pt"}
#   Several models may share one repository (one access approval for all of them) or each have
#   its own (access approved per model).

schema_version: 1

models:

  CT_ThoraxOARs_SMITplus:
    status: validated
    description: Thoracic organs at risk (left and right lung, esophagus, heart) on CT / CBCT
    modality: CT
    network: {arch: smit_plus, feature_size: 128}
    out_channels: 5
    labels: {1: Lung_L, 2: Lung_R, 3: Esophagus, 4: Heart}
    preprocessing: {hu_window: [-750, 1750], spacing_mm: [1.5, 1.5, 2.0]}
    inference: {blend: gaussian, overlap: 0.5, sw_batch_size: 1, amp: true, body_mask: true}
    weights: {sha256: "4d5cdc530d2fcdaac4512a3883937743a8fa2aef72d514eaee61024345251596", version: ""}
    card: docs/models/CT_ThoraxOARs_SMITplus.md

  CT_LungGTV_SMITplus:
    status: validated
    description: Lung tumor gross tumor volume (GTV) on CT / CBCT
    modality: CT
    network: {arch: smit_plus, feature_size: 128}
    out_channels: 2
    labels: {1: GTV}
    preprocessing: {hu_window: [-500, 500], spacing_mm: [1.5, 1.5, 2.0]}
    inference: {blend: gaussian, overlap: 0.5, sw_batch_size: 1, amp: true, body_mask: true}
    weights: {sha256: "d736901b52558bb62f375d630a331e1d2f1dbd628e22985dbc573a7695bb4990", version: ""}
    card: docs/models/CT_LungGTV_SMITplus.md

  CT_CADSRegions_SMITplus:
    status: validated
    description: CADS general anatomical regions on CT / CBCT; label 10 (spinal canal / cord) is the one validated
    modality: CT
    network: {arch: smit_plus, feature_size: 128}
    out_channels: 11
    # Names of labels 1-9 are inferred from position and volume and are unconfirmed.
    labels: {1: Unconfirmed_SubcutaneousTissue, 2: Unconfirmed_Muscle, 3: Unconfirmed_AbdominalCavity,
             4: Unconfirmed_ThoracicCavity, 5: Unconfirmed_Bones, 6: Unconfirmed_Glands,
             7: Unconfirmed_Pericardium, 8: Unconfirmed_BreastImplant, 9: Unconfirmed_Mediastinum,
             10: SpinalCanal_Cord}
    preprocessing: {hu_window: [-750, 1750], spacing_mm: [1.5, 1.5, 1.5]}
    inference: {blend: gaussian, overlap: 0.5, sw_batch_size: 1, amp: true, body_mask: true}
    weights: {sha256: "4d5770f07c9eb5b91645279a4d4e9957d722cdba6eed20329d59ad209e5caa71", version: ""}
    card: docs/models/CT_CADSRegions_SMITplus.md

  CT_HeartSubstruct_SMIT:
    status: validated
    description: Cardiac substructures (great vessels and chambers) on CT
    modality: CT
    network: {arch: smit, depths: [2, 2, 12, 2], use_encoder5: false}
    out_channels: 10
    labels: {1: Aorta, 2: Pulmonary_Artery, 3: Pulmonary_Vein, 4: SVC, 5: IVC,
             6: Right_Atrium, 7: Right_Ventricle, 8: Left_Atrium, 9: Left_Ventricle}
    preprocessing: {hu_window: [-200, 300], spacing_mm: [1.0, 1.0, 3.0]}
    inference: {blend: constant, overlap: 0.5, sw_batch_size: 4, amp: true, body_mask: true}
    weights: {sha256: "cee7a3aef8311d1578131a3fb382ba1ec045c06337a828a5b455b274c84a78c4", version: "2026-02-10"}
    card: docs/models/CT_HeartSubstruct_SMIT.md

  # ---- incomplete: network settings carried over from earlier code; not yet documented ----

  CT_HN_SMIT:

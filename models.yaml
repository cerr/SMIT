# SMIT model registry.
#
# Each entry sets the defaults run_segmentation.py uses for --model <NAME>; any option given
# on the command line overrides them. Weights are NOT in this repository: they are shared
# separately and installed with  python get_weights.py --model <NAME> --url <link>
# as weights/<NAME>.pt, then checked against weights.sha256.
#
# status:  validated  - settings, weights and checksum confirmed; model card in docs/models/
#          incomplete - network settings only; pass the preprocessing options yourself
#
# network.arch:  smit       - SMIT_3D_Seg (smit_models/smit.py); uses depths, use_encoder5
#                smit_plus  - SMIT_Plus (smit_models/smit_plus.py); uses feature_size
# preprocessing.hu_window: intensities are clipped to this range and scaled to [0, 1]
# preprocessing.spacing_mm: resampling spacing (x, y, z) before inference; output is
#                           resampled back to the input grid
# preprocessing.percentile_rescale: clip at the 99.5th percentile, rescale to 0-1000 before resampling (MR)
# preprocessing.intensity: window (default; clip to hu_window, scale to [0, 1]) or nonzero_percentile
#   (clip to intensity_percentiles of the non-zero voxels, scale to [0, 1]; for MR)
# inference.roi: patch size (default 128^3); pad_mode z_end pads only at the end in z; tta: flip averaging
# inference.body_mask: zero labels outside the body (CT, -150 HU threshold)
# postprocessing.largest_component: keep the largest connected component of each label, fill holes
# weights.sha256 / version: checksum and version of the released weights file (weights/<NAME>.safetensors)
# weights.source (optional): where get_weights.py downloads the weights when no --url / --file is given.
#   Without it, weights are shared on request (a link sent by the maintainers). Examples:
#     source: {type: huggingface, repo: cerr/CT_ThoraxOARs_SMITplus, file: CT_ThoraxOARs_SMITplus.safetensors, revision: v1.0}
#     source: {type: url, url: "https://example.org/CT_ThoraxOARs_SMITplus.safetensors"}
#   Several models may share one repository (one access approval for all of them) or each have
#   its own (access approved per model).

schema_version: 1

models:

  CT_ThoraxOARs_SMITplus:
    status: validated
    description: Thoracic organs at risk (left and right lung, esophagus, heart) on CT / CBCT
    modality: CT
    network: {arch: smit_plus, feature_size: 128}
    out_channels: 5
    labels: {1: Lung_L, 2: Lung_R, 3: Esophagus, 4: Heart}
    preprocessing: {hu_window: [-750, 1750], spacing_mm: [1.5, 1.5, 2.0]}
    inference: {blend: gaussian, overlap: 0.5, sw_batch_size: 1, amp: true, body_mask: true}
    weights: {sha256: "1756a760bc671f93493eb12055fb0128150f78b278b51be8b599b479ac5f5c7e", version: "2026-10-21"}
    card: docs/models/CT_ThoraxOARs_SMITplus.md

